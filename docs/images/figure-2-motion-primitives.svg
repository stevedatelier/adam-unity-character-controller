  <line x1="232" y1="24" x2="232" y2="278" stroke="rgba(65,62,62,0.09)" stroke-width="1"/>

  <!-- Hold -->
  <text x="0" y="68" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="rgba(65,62,62,0.88)">Hold</text>
  <text x="0" y="100" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11.5" fill="rgba(65,62,62,0.62)">Reaches target</text>
  <text x="0" y="119" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11.5" fill="rgba(65,62,62,0.62)">Stays there</text>
