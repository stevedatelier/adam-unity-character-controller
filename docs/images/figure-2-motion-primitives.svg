  <path d="M 394,212 C 412,182 444,182 462,212" fill="none" stroke="rgba(65,62,62,0.36)" stroke-width="1.5"/>
  <polygon points="286,179 294,182 286,185" fill="rgba(65,62,62,0.42)"/>
