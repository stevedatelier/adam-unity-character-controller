  <line x1="162" y1="218" x2="162" y2="223" stroke="rgba(65,62,62,0.32)" stroke-width="1.5"/>

  <!-- Oscillate -->
  <text x="248" y="68" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="15" font-weight="500" fill="rgba(65,62,62,0.88)">Oscillate</text>
  <text x="248" y="100" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11.5" fill="rgba(65,62,62,0.62)">Moves out</text>
  <text x="248" y="119" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="11.5" fill="rgba(65,62,62,0.62)">Returns</text>
