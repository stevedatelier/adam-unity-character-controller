  <text x="280" y="273" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="9" letter-spacing="0.04em" fill="rgba(65,62,62,0.62)" text-anchor="middle">Stage 1 heuristic: zero inference cost</text>
