  <text x="95" y="190" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="8.5" fill="rgba(65,62,62,0.7)" text-anchor="start">&lt;5ms</text>

  <line x1="60" y1="240" x2="525" y2="240" stroke="rgba(65,62,62,0.1)" stroke-width="1"/>
  <rect x="60" y="232" width="350" height="8" rx="2" fill="rgba(65,62,62,0.15)"/>
  <text x="50" y="239" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="8.5" fill="rgba(65,62,62,0.68)" text-anchor="end">TOTAL</text>

  <line x1="350" y1="40" x2="350" y2="248" stroke="rgba(65,62,62,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
